[platformio]
default_envs = cores3-streaming
src_dir = .

[env]
platform = espressif32@6.3.2
board = esp32s3box
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.arduino.partitions = my_cores3_16MB.csv
board_build.f_flash = 80000000L
board_build.filesystem = spiffs
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
upload_speed = 1500000
extra_scripts = pre:scripts/platformio_model.py
lib_deps =
    m5stack/M5Unified @ 0.2.15

[common]
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_M5STACK_CORES3
    -Isrc
w8a32_flags =
    ${common.build_flags}
    -DSAAN_INT8_ACT=0
    -DSAAN_PIE=0
pie_flags =
    ${common.build_flags}
    -DSAAN_INT8_ACT=1
    -DSAAN_PIE=1

[env:cores3-inference]
build_flags = ${common.w8a32_flags}
build_src_filter =
    -<*>
    +<examples/01_inference/main.cpp>
    +<src/saan_model.c>

[env:cores3-pie]
build_flags = ${common.pie_flags}
build_src_filter =
    -<*>
    +<examples/02_pie_inference/main.cpp>
    +<src/saan_model.c>

[env:cores3-buffered]
build_flags = ${common.pie_flags}
build_src_filter =
    -<*>
    +<examples/03_buffered_playback/main.cpp>
    +<src/saan_model.c>

; Compatibility environments retain the previous buffered playback behavior.
[env:m5stack-cores3]
extends = env:cores3-buffered
build_flags = ${common.w8a32_flags}

[env:m5stack-cores3-pie]
extends = env:cores3-buffered

[env:cores3-streaming]
build_flags = ${common.pie_flags}
build_src_filter =
    -<*>
    +<examples/04_streaming_playback/main.cpp>
    +<src/saan_model.c>

[env:cores3-text-input]
build_flags =
    ${common.pie_flags}
    -DCHARSET_UTF_8
    -DLABEL_IDS_EXTERNAL_SCRATCH=1
    -DSAAN_KANJI=1
extra_scripts =
    ${env.extra_scripts}
    pre:scripts/platformio_dictionary.py
build_src_filter =
    -<*>
    +<examples/05_text_input/*.cpp>
    +<examples/05_text_input/*.c>
    +<src/saan_model.c>
    +<lib/saanotts_core/jdict.c>
    +<lib/saanotts_core/accent.c>
    +<lib/saanotts_core/njd_rules.c>
    +<lib/saanotts_core/label_ids.c>
    +<lib/saanotts_core/oj_heap_psram.c>
    +<lib/saanotts_core/openjtalk/*.c>
